name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish; a missing tag is created automatically, for example 1.0.0 or v1.0.0
        required: true
        default: 'v1.0.0'
        type: string
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Validate version tag
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v?(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
            throw 'Use a stable version such as 1.0.0 or v1.0.0.'
          }
          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Check out the exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify any existing tag matches the build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG" | ConvertFrom-Json)
          $tag = $tags | Where-Object { $_.ref -ceq "refs/tags/$env:RELEASE_TAG" }
          if ($tag) {
            $commit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq '.sha'
            if ($commit -cne '${{ github.sha }}') {
              throw 'The existing version tag points to a different commit. Select that tag to rerun, or use a new version.'
            }
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Run regular core and desktop tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore tests/HoyoFileClean.Tests.csproj
          dotnet restore desktop.tests/HoyoFileClean.Desktop.Tests.csproj
          ./tests/run-tests.ps1 -Suite All -Full
          if ($LASTEXITCODE -ne 0) { throw 'Regular tests failed.' }

      - name: Build and package four downloads
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'hoyofileclean-release'
          $cache = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $HOME '.nuget/packages' }
          foreach ($desktop in @($true, $false)) {
            foreach ($bundled in @($true, $false)) {
              $kind = if ($desktop) { 'desktop' } else { 'cli' }
              $mode = if ($bundled) { "$kind-with-dotnet" } else { $kind }
              $project = if ($desktop) { 'desktop/HoyoFileClean.Desktop.csproj' } else { 'HoyoFileClean.csproj' }
              $folder = Join-Path $root $mode
              dotnet publish $project -c Release -r win-x64 --self-contained $bundled.ToString().ToLowerInvariant() "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true -p:DebugType=None -o $folder
              Copy-Item -LiteralPath LICENSE, THIRD-PARTY-NOTICES.md -Destination $folder
              if ($bundled) {
                $config = Get-Content -Path (Join-Path $folder '*.runtimeconfig.json') -Raw | ConvertFrom-Json
                foreach ($framework in $config.runtimeOptions.includedFrameworks) {
                  $pack = "$($framework.name.ToLowerInvariant()).runtime.win-x64"
                  $package = Join-Path $cache "$pack/$($framework.version)"
                  $licenses = @(Get-ChildItem -LiteralPath $package -File | Where-Object { $_.Name -match 'license|third.party.notices' })
                  if (!$licenses.Count) { throw "Missing runtime license: $pack" }
                  $licenseFolder = Join-Path $folder "licenses/$($framework.name)"
                  New-Item -ItemType Directory -Path $licenseFolder | Out-Null
                  $licenses | Copy-Item -Destination $licenseFolder
                }
              }
              $zip = Join-Path $root "HoyoFileClean-$env:RELEASE_VERSION-win-x64-$mode.zip"
              Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zip -CompressionLevel Optimal
            }
          }
          "RELEASE_OUTPUT=$root" >> $env:GITHUB_ENV

      - name: Upload downloads and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $files = @(Get-ChildItem -LiteralPath $env:RELEASE_OUTPUT -File -Filter '*.zip')
          gh release create $env:RELEASE_TAG @($files.FullName) --repo $env:GITHUB_REPOSITORY --target '${{ github.sha }}' --title $env:RELEASE_TAG --notes 'Windows x64: with-dotnet ZIPs include .NET; smaller ZIPs require .NET 10. Each ZIP includes project and third-party licenses.'
          "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
