// Schema source (MIT): CollapseLauncher/Hi3Helper.Sophon,
// commit 4c6001e8585ffa2fda78805db0ab960e3245c049,
// Protos/SophonManifestProto.proto. See THIRD-PARTY-NOTICES.md.
// Field names follow GIAudioPatch; field numbers and types are unchanged.
syntax = "proto3";

option csharp_namespace = "HoyoFileClean.Protos";

message SophonManifestProto {
  repeated SophonManifestAssetProperty assets = 1;
}

message SophonManifestAssetProperty {
  string asset_name = 1;
  repeated SophonManifestAssetChunk asset_chunks = 2;
  int32 asset_type = 3;
  int64 asset_size = 4;
  string asset_hash_md5 = 5;
}

message SophonManifestAssetChunk {
  string chunk_name = 1;
  string chunk_decompressed_hash_md5 = 2;
  int64 chunk_on_file_offset = 3;
  int64 chunk_size = 4;
  int64 chunk_size_decompressed = 5;
}

// Read-only projection: field numbers match the full schema above. Chunk payloads
// are length-delimited opaque fields for file-list conversion, never materialized.
message SophonFileManifest {
  repeated SophonFileAsset assets = 1;
}

message SophonFileAsset {
  string asset_name = 1;
  reserved 2;
  int32 asset_type = 3;
  int64 asset_size = 4;
  string asset_hash_md5 = 5;
}
